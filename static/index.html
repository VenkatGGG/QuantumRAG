<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cryptography RAG Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: white;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 .icon {
            font-size: 1.5rem;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
        }

        .status-indicator.disconnected {
            background: #f44336;
        }

        .status-indicator.connecting {
            background: #FF9800;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .welcome-message h2 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .welcome-message p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .example-queries {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .example-query {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .example-query:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .message-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 12px 16px;
            color: white;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message-time {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            text-align: right;
        }

        .message.assistant .message-time {
            text-align: left;
        }

        /* Retrieved context styling */
        .retrieved-context {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .context-header {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .context-snippets {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .context-snippet {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            border-left: 3px solid #11998e;
        }

        .snippet-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .snippet-rank {
            color: rgba(255, 255, 255, 0.5);
        }

        .snippet-similarity {
            background: rgba(17, 153, 142, 0.3);
            color: #38ef7d;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .snippet-similarity.medium {
            background: rgba(255, 152, 0, 0.3);
            color: #FFB74D;
        }

        .snippet-similarity.low {
            background: rgba(244, 67, 54, 0.3);
            color: #EF5350;
        }

        .input-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #FFCDD2;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <span class="icon">🔐</span>
            Quantum Cryptography RAG
        </h1>
        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="status-item">
                <span>Chunks:</span>
                <span id="chunkCount">-</span>
            </div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-message" id="welcomeMessage">
            <h2>Welcome to the Quantum Cryptography Assistant</h2>
            <p>Ask me anything about quantum cryptography, quantum key distribution,<br>post-quantum cryptography, or related topics.</p>
            <div class="example-queries">
                <button class="example-query" onclick="setQuery('What is quantum key distribution?')">What is quantum key distribution?</button>
                <button class="example-query" onclick="setQuery('How does BB84 protocol work?')">How does BB84 protocol work?</button>
                <button class="example-query" onclick="setQuery('What is quantum entanglement?')">What is quantum entanglement?</button>
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                class="message-input" 
                id="messageInput" 
                placeholder="Type your question about quantum cryptography..."
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton" onclick="sendMessage()">
                ➤
            </button>
        </div>
        <div class="footer">
            Powered by Local RAG • No external APIs • Pure NumPy & Transformers
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        let isProcessing = false;
        let conversationHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            setupInputHandling();
        });

        // Check API status
        async function checkStatus() {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const chunkCount = document.getElementById('chunkCount');

            indicator.className = 'status-indicator connecting';
            statusText.textContent = 'Connecting...';

            try {
                const response = await fetch(`${API_BASE_URL}/status`);
                if (response.ok) {
                    const data = await response.json();
                    indicator.className = 'status-indicator';
                    statusText.textContent = 'Connected';
                    chunkCount.textContent = data.chunk_count;
                } else {
                    throw new Error('Status check failed');
                }
            } catch (error) {
                indicator.className = 'status-indicator disconnected';
                statusText.textContent = 'Disconnected';
                chunkCount.textContent = '-';
                console.error('Failed to check status:', error);
            }
        }

        // Setup input handling
        function setupInputHandling() {
            const input = document.getElementById('messageInput');
            
            // Auto-resize textarea
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 150) + 'px';
            });

            // Send on Enter (Shift+Enter for new line)
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // Set query from example button
        function setQuery(query) {
            const input = document.getElementById('messageInput');
            input.value = query;
            input.focus();
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        }

        // Send message
        async function sendMessage() {
            if (isProcessing) return;

            const input = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const query = input.value.trim();

            if (!query) return;

            // Hide welcome message on first message
            const welcomeMessage = document.getElementById('welcomeMessage');
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }

            // Add user message to chat
            addMessage('user', query);
            conversationHistory.push({ role: 'user', content: query });

            // Clear input
            input.value = '';
            input.style.height = 'auto';

            // Show typing indicator
            isProcessing = true;
            sendButton.disabled = true;
            const typingId = addTypingIndicator();

            try {
                // Call API
                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query, k: 5 })
                });

                // Remove typing indicator
                removeTypingIndicator(typingId);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to get response');
                }

                const data = await response.json();

                // Add assistant response with context
                addAssistantResponse(data.results);
                conversationHistory.push({ role: 'assistant', results: data.results });

            } catch (error) {
                removeTypingIndicator(typingId);
                addErrorMessage(error.message);
                console.error('Query failed:', error);
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
            }
        }

        // Add message to chat
        function addMessage(role, content, contextData = null) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = role === 'user' ? '👤' : '🤖';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let contentHtml = escapeHtml(content);

            // Add retrieved context if present
            if (contextData && contextData.length > 0) {
                contentHtml += formatRetrievedContext(contextData);
            }

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                    <div class="message-content">${contentHtml}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            container.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add assistant response with context
        function addAssistantResponse(results) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Build response text
            let responseText = "Based on the retrieved context, here's what I found:";
            if (results.length === 0) {
                responseText = "I couldn't find any relevant information in the knowledge base. Try rephrasing your question.";
            }

            const contextHtml = results.length > 0 ? formatRetrievedContext(results) : '';

            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div>
                    <div class="message-content">
                        ${escapeHtml(responseText)}
                        ${contextHtml}
                    </div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            container.appendChild(messageDiv);
            scrollToBottom();
        }

        // Format retrieved context snippets
        function formatRetrievedContext(results) {
            let html = '<div class="retrieved-context">';
            html += '<div class="context-header">📚 Retrieved Context</div>';
            html += '<div class="context-snippets">';

            results.forEach((result, index) => {
                const similarityPercent = (result.similarity * 100).toFixed(1);
                const similarityClass = result.similarity > 0.8 ? '' : 
                                       result.similarity > 0.6 ? 'medium' : 'low';

                html += `
                    <div class="context-snippet">
                        <div>${escapeHtml(result.text)}</div>
                        <div class="snippet-meta">
                            <span class="snippet-rank">#${index + 1}</span>
                            <span class="snippet-similarity ${similarityClass}">${similarityPercent}% match</span>
                        </div>
                    </div>
                `;
            });

            html += '</div></div>';
            return html;
        }

        // Add typing indicator
        function addTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const id = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = id;
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div>
                    <div class="message-content typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            container.appendChild(typingDiv);
            scrollToBottom();
            return id;
        }

        // Remove typing indicator
        function removeTypingIndicator(id) {
            const typingDiv = document.getElementById(id);
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        // Add error message
        function addErrorMessage(errorText) {
            const container = document.getElementById('chatContainer');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message assistant';
            errorDiv.innerHTML = `
                <div class="message-avatar">⚠️</div>
                <div>
                    <div class="message-content">
                        <div class="error-message">Error: ${escapeHtml(errorText)}</div>
                    </div>
                </div>
            `;
            container.appendChild(errorDiv);
            scrollToBottom();
        }

        // Scroll to bottom of chat
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
